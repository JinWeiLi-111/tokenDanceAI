[project]
name = "tokendanceai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xiongkang", email = "xkang744@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.156.8",
    "jinja2>=3.1.6",
    "pydantic>=2.7",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tokendanceai = "tokendanceai:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle + pyflakes + isort

[tool.ruff.format]
quote-style = "double"
