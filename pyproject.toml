[project]
name = "tokendanceai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xiongkang", email = "xkang744@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "asyncpq>=0.44",
    "fastapi[standard]>=0.156.8",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "mcp>=2.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.7",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tokendanceai = "tokendanceai:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle + pyflakes + isort

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"          # 关键：让所有 async def 测试自动被当协程跑，不用每个都加 @pytest.mark.asyncio
testpaths = ["tests"]           # 测试都放 tests/ 目录
pythonpath = ["src"]            # 让测试能 import tokendanceai（项目用 src-layout）
addopts = "-v --tb=short"       # 默认详细输出 + 精简 traceback
