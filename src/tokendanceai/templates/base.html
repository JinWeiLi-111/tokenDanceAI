<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TokenDance AI{% endblock %}</title>
  <style>
    /* ─── Design tokens ──────────────────────────────────────────────── */
    :root {
      --gray-0:  oklch(98%  0.004 264);
      --gray-1:  oklch(94%  0.006 264);
      --gray-2:  oklch(88%  0.008 264);
      --gray-3:  oklch(70%  0.010 264);
      --gray-4:  oklch(52%  0.012 264);
      --gray-5:  oklch(36%  0.014 264);
      --gray-6:  oklch(24%  0.016 264);
      --gray-7:  oklch(17%  0.018 264);
      --gray-8:  oklch(13%  0.018 264);
      --gray-9:  oklch( 9%  0.016 264);

      --accent:        oklch(72% 0.18 162);   /* teal-green */
      --accent-dim:    oklch(60% 0.14 162);
      --accent-subtle: oklch(20% 0.06 162);
      --accent-border: oklch(30% 0.10 162);

      --warn:    oklch(78% 0.16  80);
      --danger:  oklch(66% 0.20  25);
      --info:    oklch(70% 0.15 240);

      /* surfaces */
      --bg:           var(--gray-9);
      --bg-raised:    var(--gray-8);
      --bg-elevated:  var(--gray-7);
      --border:       var(--gray-6);
      --border-subtle:var(--gray-7);

      /* text */
      --text:         var(--gray-1);
      --text-muted:   var(--gray-3);
      --text-faint:   var(--gray-4);

      /* sidebar */
      --sidebar-w: 260px;

      /* radius */
      --r-sm: 4px;
      --r-md: 8px;
      --r-lg: 12px;

      /* space rhythm: 4px base */
      --s1:  4px;  --s2:  8px;  --s3: 12px;
      --s4: 16px;  --s5: 20px;  --s6: 24px;
      --s8: 32px;  --s10:40px;

      --font-sans: "Inter", "Helvetica Neue", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
      --line-body: 1.6;
      --measure: 68ch;
    }

    [data-theme="light"] {
      --bg:           var(--gray-0);
      --bg-raised:    #ffffff;
      --bg-elevated:  var(--gray-1);
      --border:       var(--gray-2);
      --border-subtle:var(--gray-1);
      --text:         var(--gray-9);
      --text-muted:   var(--gray-5);
      --text-faint:   var(--gray-4);
    }

    /* ─── Reset / base ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 15px; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: var(--line-body);
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-dim); text-decoration: underline; }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    code, pre, kbd {
      font-family: var(--font-mono);
      font-size: 0.85em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <script>
    // theme toggle persistence
    const saved = localStorage.getItem('td-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    window.__toggleTheme = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('td-theme', next);
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
